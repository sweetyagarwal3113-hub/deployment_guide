<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Predictor (Hugging Face)</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }
        input {
            background-color: #334155;
            color: white;
            font-size: 1rem;
        }
        button {
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #334155;
            display: none;
            line-height: 1.5;
        }
        .positive { color: #4ade80; font-weight: bold; }
        .negative { color: #f87171; font-weight: bold; }
        .neutral { color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>📈 AI Stock Predictor</h1>
    <p style="font-size: 0.9rem; color: #94a3b8; text-align: center;">Powered by Hugging Face FinBERT</p>
    
    <!-- Inputs -->
    <input type="text" id="hfToken" placeholder="Enter Hugging Face Token (hf_...)" />
    <input type="text" id="newsHeadline" placeholder="Enter a recent news headline about the stock" value="EaseMyTrip announces strong quarterly profits and new electric bus venture." />
    
    <button onclick="analyzeStock()">Predict Trend</button>

    <!-- Results Area -->
    <div id="result">
        <p><strong>AI Verdict:</strong> <span id="sentimentLabel">...</span></p>
        <p><strong>Confidence:</strong> <span id="confidenceScore">...</span></p>
        <p><strong>Market Forecast:</strong> <span id="forecastText">...</span></p>
    </div>
</div>

<script>
    async function analyzeStock() {
        const token = document.getElementById("hfToken").value;
        const headline = document.getElementById("newsHeadline").value;
        const resultDiv = document.getElementById("result");
        const btn = document.querySelector("button");

        if (!token) {
            alert("Please enter your Hugging Face API Token.");
            return;
        }

        btn.innerText = "Analyzing via Hugging Face...";
        btn.disabled = true;

        try {
            // Call Hugging Face API directly from JS
            const response = await fetch("https://api-inference.huggingface.co/models/ProsusAI/finbert", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ inputs: headline })
            });

            const data = await response.json();

            if (data.error) {
                alert("API Error: " + data.error);
                throw new Error(data.error);
            }

            // FinBERT returns an array of probabilities. Get the highest one.
            const predictions = data[0];
            const topPrediction = predictions.reduce((prev, current) => 
                (prev.score > current.score) ? prev : current
            );

            // Update UI
            resultDiv.style.display = "block";
            
            const labelEl = document.getElementById("sentimentLabel");
            labelEl.innerText = topPrediction.label.toUpperCase();
            labelEl.className = topPrediction.label; // Applies CSS color

            document.getElementById("confidenceScore").innerText = (topPrediction.score * 100).toFixed(1) + "%";

            const forecastEl = document.getElementById("forecastText");
            if (topPrediction.label === "positive") {
                forecastEl.innerText = "BULLISH (Expected to go UP 🚀)";
            } else if (topPrediction.label === "negative") {
                forecastEl.innerText = "BEARISH (Expected to go DOWN 📉)";
            } else {
                forecastEl.innerText = "NEUTRAL (Expected to remain FLAT ➖)";
            }

        } catch (err) {
            console.error(err);
        } finally {
            btn.innerText = "Predict Trend";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
